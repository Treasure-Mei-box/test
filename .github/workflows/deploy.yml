name: CI/CD Pipeline - Build, Test & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------
  # CI: lint + unit tests (runs on every push and pull request)
  # ---------------------------------------------------------------
  lint-and-test:
    name: Code Linting and Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Code with Flake8
        run: |
          # Hard fail on syntax errors / undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Style report (advisory). Remove --exit-zero to make it block the build.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit Tests with Pytest
        run: |
          # Failing tests stop the pipeline (no "|| true").
          # pytest exits with code 5 if no tests are found, so keep at least one test.
          pytest -v

  # ---------------------------------------------------------------
  # Build: package the app as a Docker image and push to GHCR
  # ---------------------------------------------------------------
  build-and-push-docker:
    name: Container Packaging & Push
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------------------------------------------------------------
  # CD (1/2): deploy to the TEST environment + smoke test
  # ---------------------------------------------------------------
  deploy-to-test:
    name: Deploy to Test (Azure App Service)
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test

    steps:
      # GHCR image names must be lowercase
      - name: Compute lowercase image name
        run: echo "IMAGE=${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Deploy Container to Azure Test Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'YLS-testing'
          publish-profile: ${{ secrets.YLS_TESTING_PUBLISH_PROFILE }}
          # Deploy the exact commit's image so you can prove which build is running
          images: ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Smoke Test (test environment)
        env:
          # Uses the APP_URL variable of the "test" environment if set,
          # otherwise falls back to the URL returned by the deploy step.
          APP_URL: ${{ vars.APP_URL || steps.deploy.outputs.webapp-url }}
        run: |
          echo "Testing: $APP_URL/health"
          curl --fail --silent --show-error \
               --retry 12 --retry-delay 10 --retry-connrefused \
               "$APP_URL/health"

  # ---------------------------------------------------------------
  # CD (2/2): deploy to PRODUCTION after test passes.
  # In GitHub: Settings > Environments > production > "Required reviewers"
  # makes this a manual approval gate (deferred deployment).
  # ---------------------------------------------------------------
  deploy-to-production:
    name: Deploy to Production (Azure App Service)
    needs: deploy-to-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Compute lowercase image name
        run: echo "IMAGE=${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Deploy Container to Azure Production Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'YLS-production'
          publish-profile: ${{ secrets.YLS_PROD_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Smoke Test (production)
        env:
          APP_URL: ${{ vars.APP_URL || steps.deploy.outputs.webapp-url }}
        run: |
          echo "Testing: $APP_URL/health"
          curl --fail --silent --show-error \
               --retry 12 --retry-delay 10 --retry-connrefused \
               "$APP_URL/health"