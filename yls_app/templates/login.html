{% extends "base.html" %}
{% block content %}
<section class="card narrow">
    <h2>Login</h2>
    <form method="post">
        <label>Email</label>
        <input name="email" type="email" required>
        <label>Password</label>
        <input name="password" type="password" required>
        <button type="submit">Login</button>
    </form>
</section>
{% endblock %}
