{% extends "base.html" %}
{% block content %}
<section class="card narrow">
    {% if product %}<h2>Edit Product</h2>{% else %}<h2>Add Product</h2>{% endif %}
    <form method="post">
        <label>Name</label>
        <input name="name" value="{{ product.name if product else '' }}" required>
        {% if not product %}
        <label>Category</label>
        <select name="category_id">
            {% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}
        </select>
        {% endif %}
        <label>Price</label>
        <input name="price" type="number" step="0.01" min="0" value="{{ product.price if product else '' }}" required>
        <label>Stock Quantity</label>
        <input name="stock_quantity" type="number" min="0" value="{{ product.stock_quantity if product else '' }}" required>
        <label>Description</label>
        <textarea name="description">{{ product.description if product else '' }}</textarea>
        <button type="submit">Save Product</button>
    </form>
</section>
{% endblock %}
