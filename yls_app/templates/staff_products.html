{% extends "base.html" %}
{% block content %}
<section class="card">
    <h2>Staff Product Management</h2>
    <a class="button-link" href="{{ url_for('main.add_product') }}">Add Product</a>
</section>
<section class="card">
    <table>
        <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Edit</th></tr></thead>
        <tbody>
        {% for product in products %}
            <tr>
                <td>{{ product.id }}</td><td>{{ product.name }}</td><td>{{ product.category }}</td>
                <td>${{ "%.2f"|format(product.price) }}</td><td>{{ product.stock_quantity }}</td>
                <td><a href="{{ url_for('main.edit_product', product_id=product.id) }}">Edit</a></td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
